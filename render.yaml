# Render Blueprint: describes the whole deployment. See docs/DEPLOYMENT.md.
# One Node web service serves both the API and the built web app.
# FREE VERSION: the free instance has no persistent disk, so the SQLite database and uploaded documents
# are erased whenever the service restarts, redeploys or wakes from sleep. For lasting data switch to the
# paid setup described in docs/DEPLOYMENT.md (plan: starter, a disk, DB_DIR and UPLOAD_DIR).
services:
  - type: web
    name: doc-driver-on-call
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm install --prefix server && npm install --include=dev --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # The values below are secret or personal, so they are typed into Render's dashboard, not this file.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
